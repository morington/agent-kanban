services:
  kanban:
    build: .
    image: agent-kanban:local
    restart: unless-stopped
    user: "${KANBAN_UID:-1000}:${KANBAN_GID:-1000}"
    ports:
      - "${KANBAN_PORT:-7777}:7777"
    environment:
      KANBAN_HOST: "0.0.0.0"
      KANBAN_PORT: "7777"
      KANBAN_DB: /app/tasks.db
      KANBAN_ACTOR: ${KANBAN_ACTOR:-user}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-kanban}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-kanban@local}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-kanban}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-kanban@local}
    volumes:
      # Source + SQLite/WAL/inbox live on the host so restarts keep data
      # and Python changes apply after `docker compose restart`.
      - .:/app
      # Absolute host paths stored in projects.path.
      - ${KANBAN_WORKSPACES_DIR:-/home/adam/Documents/Development}:${KANBAN_WORKSPACES_DIR:-/home/adam/Documents/Development}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7777/api/projects')",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
